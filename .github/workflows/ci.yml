name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [control-plane, controllers, analyzer, builder, verifier, providers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "**/go.sum"
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet & test (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test ./... -count=1

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install pnpm
        run: npm i -g pnpm@9
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: lint-ts (eslint + prettier)
        run: make lint-ts
      - name: mcp protocol conformance
        run: make test-mcp-conformance
      - name: scenario scripts syntax
        run: |
          for s in success-path negative nl-regression; do
            node --check "e2e/scenarios/$s.mjs"
          done
