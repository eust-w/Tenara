name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: tenara
          POSTGRES_PASSWORD: tenara_pg_dev
          POSTGRES_DB: tenara
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U tenara -d tenara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    strategy:
      fail-fast: false
      matrix:
        module: [control-plane, controllers, analyzer, builder, verifier, providers]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: migrate schema (control-plane)
        if: matrix.module == 'control-plane'
        run: |
          GOBIN=$(pwd)/bin go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          ./bin/migrate -path control-plane/internal/store/migrations \
            -database "postgres://tenara:tenara_pg_dev@127.0.0.1:15432/tenara?sslmode=disable" up
      - name: vet & test (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - name: run per-module
        run: |
          set -e
          for m in control-plane controllers analyzer builder verifier providers; do
            echo "== $m";
            (cd "$m" && "$(go env GOPATH)/bin/golangci-lint" run ./...);
          done

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pnpm
        run: npm i -g pnpm@10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: lint-ts (eslint + prettier)
        run: make lint-ts
      - name: mcp protocol conformance
        run: make test-mcp-conformance
      - name: scenario scripts syntax
        run: |
          for s in success-path negative nl-regression; do
            node --check "e2e/scenarios/$s.mjs"
          done
