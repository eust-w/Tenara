# Default chart values. Digests come from build-digests.yaml generated by
# scripts/build-images.sh; no floating tags are allowed (R3 digest-only).
image:
  repository: localhost:5000/tenara
  pullPolicy: IfNotPresent

scheduling:
  nodeSelector:
    tenara.io/role: management
  tolerations:
    - key: tenara.io/role
      operator: Equal
      value: management
      effect: NoSchedule

config:
  logLevel: info

controlPlane:
  port: 8080
