# Demo workload + HTTPRoute used to prove Gateway TLS routing end to end.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-echo
  namespace: tenara-system
  labels:
    app: demo-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-echo
  template:
    metadata:
      labels:
        app: demo-echo
    spec:
      nodeSelector:
        tenara.io/role: tenant
      tolerations:
        - key: tenara.io/role
          operator: Equal
          value: tenant
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: logs
              mountPath: /var/log/nginx
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: index
          configMap:
            name: demo-echo-index
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-echo-index
  namespace: tenara-system
data:
  index.html: "hello from tenara gateway"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-echo
  namespace: tenara-system
spec:
  selector:
    app: demo-echo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-echo
  namespace: tenara-system
spec:
  parentRefs:
    - name: tenara
      sectionName: https
  hostnames:
    - "demo.127.0.0.1.nip.io"
  rules:
    - backendRefs:
        - name: demo-echo
          port: 80
