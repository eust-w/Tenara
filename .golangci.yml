version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # ── Correctness ─────────────────────────────────────────────
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - nilerr
    - nilnil
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - fatcontext
    - copyloopvar
    - intrange
    - usetesting
    - testifylint

    # ── Style / readability ─────────────────────────────────────
    # gofumpt / goimports live under `formatters` in v2.13+; enabled below.
    - whitespace
    - misspell
    - unconvert
    - unparam
    - ineffassign
    - dupword

    # ── Architecture ────────────────────────────────────────────
    - gocognit
    - gocyclo
    - funlen
    - lll
    - nestif
    - revive
    - unused

    # ── Exhaustiveness ──────────────────────────────────────────
    - exhaustive

    # ── Security ────────────────────────────────────────────────
    - gosec

    # ── Logging ─────────────────────────────────────────────────
    - sloglint

    # ── Performance ─────────────────────────────────────────────
    - perfsprint
    - prealloc
    - makezero

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        # Writing an error to a broken client connection has nowhere to go.
        - (*encoding/json.Encoder).Encode
        # Notification emails are fire-and-forget by contract.
        - (tenara/control-plane/internal/auth.SMTPSender).SendVerification

    govet:
      enable-all: true
      settings:
        shadow:
          strict: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    gocognit:
      min-complexity: 25

    gocyclo:
      min-complexity: 15

    funlen:
      lines: 90
      statements: 60
      ignore-comments: true

    lll:
      line-length: 120
      tab-width: 4

    nestif:
      min-complexity: 4

    exhaustive:
      default-signifies-exhaustive: false
      check:
        - switch
        - map

    gosec:
      excludes:
        - G104
        - G304

    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      no-raw-keys: true
      key-naming-case: snake

    testifylint:
      enable-all: true
      disable:
        - require-error

    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: range-val-in-closure
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unhandled-error
          arguments:
            - "fmt.Print.*"
            - "fmt.Fprint.*"

    perfsprint:
      integer-format: true
      error-format: true
      bool-format: true
      string-format: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - lll
          - errcheck
          - gosec
          - bodyclose
          - revive
      # Handler layer implements the generated ServerInterface whose names
      # (AppId etc.) intentionally mirror the OpenAPI contract, so revive's
      # initialism preference cannot apply here.
      - path: internal/httpapi/
        linters:
          - revive
      # Plan response DTOs mirror the OpenAPI wire contract; Go memory
      # layout is irrelevant and time.Time internals make this unfixable.
      - path: orchestrator/plan/generator\.go$
        linters:
          - govet
      # Wire-DTO/handler-singleton/test structs: layout irrelevant.
      - path: apps/domains\.go$
        linters:
          - govet
      - path: apps/handlers\.go$
        linters:
          - govet
      - path: apps/deployments\.go$
        linters:
          - govet
      - path: apps/deployments_test\.go$
        linters:
          - govet
      - path: auth/domains_http_test\.go$
        linters:
          - govet
      # Analyzer offline fixture scanner: local-trusted walk over user-provided
      # repo path; FileFact mirrors the stage document layout.
      - path: internal/facts/facts\.go$
        linters:
          - govet
          - gosec
      # K8s API wire DTO layout mirrors upstream conventions.
      - path: controllers/internal/build/types\.go$
        linters:
          - govet
      - path: controllers/internal/appenv/types\.go$
        linters:
          - govet
      - path: controllers/internal/database/types\.go$
        linters:
          - govet
      # Drift audit payload mirrors artifact JSON ordering.
      - path: controllers/internal/appenv/drift\.go$
        linters:
          - govet
      # Diagnostics payload mirrors artifact JSON ordering.
      - path: internal/diagnose/diagnose\.go$
        linters:
          - govet
      # Wave 11 packages: fieldalignment heuristics flag mixed value/pointer
      # structs; errcheck on best-effort parsing is by design.
      - path: internal/logs/
        linters:
          - govet
          - errcheck
      - path: internal/limits/
        linters:
          - govet
      - path: internal/metering/
        linters:
          - govet
      - path: internal/securityevent/
        linters:
          - govet
      # Previews webhook DTOs mix string/pointer transport payloads;
      # layout hints are noise for a thin receiver shim.
      - path: internal/previews/
        linters:
          - govet

      # Baidu readiness stubs (D2/PoC): mixed value/pointer DTO structs;
      # layout hints are noise until live wiring lands.
      - path: database/baidudocdb/
        linters:
          - govet
      - path: dns/baidu/
        linters:
          - govet
      - path: network/baidu/
        linters:
          - govet
      - path: registry/baidu-ccr/
        linters:
          - govet
      - path: runtime/baidu-cce/
        linters:
          - govet
      - path: storage/baidu-bos/
        linters:
          - govet
      # Verification report mirrors artifact JSON key ordering.
      - path: internal/verify/report\.go$
        linters:
          - govet
      # Test doubles carry no wire semantics.
      - path: providers/mongo/local/provider_test\.go$
        linters:
          - govet
      - path: providers/storage/local/provider_test\.go$
        linters:
          - govet
      # Generated code never lints (oapi-codegen output).
      - path: \.gen\.go$
        linters:
          - all

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - tenara
  exclusions:
    paths:
      - \.gen\.go$
